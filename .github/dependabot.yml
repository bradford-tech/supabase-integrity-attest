version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    assignees:
      - sbs44
    schedule:
      interval: daily
    groups:
      all:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    assignees:
      - sbs44
    schedule:
      interval: daily
    ignore:
      # .ncurc.cjs: typescript → minor only
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # docs/.ncurc.cjs: @types/node, eslint → minor only
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # docs/.ncurc.cjs: js-yaml → minor only (@markdoc/next.js loader
      # emits `import yaml from 'js-yaml'`; v5 removed the default export)
      - dependency-name: 'js-yaml'
        update-types: ['version-update:semver-major']
      # docs/.ncurc.cjs + demo/.ncurc.cjs: reject react
      - dependency-name: 'react'
      # docs/.ncurc.cjs: reject react-dom
      - dependency-name: 'react-dom'
      # demo/.ncurc.cjs: Expo-managed — handled by expo-install-fix.yml
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-safe-area-context'
      - dependency-name: '@types/react'
      - dependency-name: 'eslint-config-expo'
    groups:
      all:
        patterns: ['*']
  # NOTE: no /docs entry — docs is an npm workspace sharing the root
  # package-lock.json, so a directory-scoped dependabot entry produces PRs
  # that desync the root lockfile and always fail `npm ci`. The root npm
  # entry above covers docs dependencies.
  - package-ecosystem: npm
    directory: /demo/supabase-expo-demo
    assignees:
      - sbs44
    schedule:
      interval: daily
    ignore:
      # Expo-managed — handled by expo-install-fix.yml
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-safe-area-context'
      - dependency-name: '@types/react'
      - dependency-name: 'eslint-config-expo'
    groups:
      all:
        patterns: ['*']

name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs['packages/lib--release_created'] }}
        with:
          ref: ${{ steps.release.outputs['packages/lib--tag_name'] }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: ${{ steps.release.outputs['packages/lib--release_created'] }}
        with:
          deno-version-file: .deno-version

      - name: Verify
        if: ${{ steps.release.outputs['packages/lib--release_created'] }}
        working-directory: packages/lib
        run: deno task check
        env:
          DENO_NO_PACKAGE_JSON: 1

      - name: Publish to JSR
        if: ${{ steps.release.outputs['packages/lib--release_created'] }}
        working-directory: packages/lib
        run: deno publish
        env:
          DENO_NO_PACKAGE_JSON: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.release.outputs['packages/lib--release_created'] }}
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Build npm package
        if: ${{ steps.release.outputs['packages/lib--release_created'] }}
        working-directory: packages/lib
        run: deno run -A scripts/build_npm.ts "$VERSION"
        env:
          DENO_NO_PACKAGE_JSON: 1
          VERSION: ${{ steps.release.outputs['packages/lib--version'] }}

      - name: Publish to npm
        if: ${{ steps.release.outputs['packages/lib--release_created'] }}
        working-directory: packages/lib/npm
        run: npm publish --access public
